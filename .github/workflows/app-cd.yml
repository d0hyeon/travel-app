name: App CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/waylog-app/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
    tags:
      - 'app-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/waylog-app/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      is_mandatory:
        description: 필수 업데이트로 배포한다 (앱 시작 시 즉시 적용)
        type: boolean
        default: false

concurrency:
  group: app-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/waylog-app

jobs:
  update-preview:
    name: EAS Update (PR preview)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --branch pr-${{ github.event.pull_request.number }} --environment preview --non-interactive

  update-production:
    name: EAS Update (production)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      BUNDLE_IS_MANDATORY: ${{ inputs.is_mandatory == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm test
      - run: eas update --branch production --environment production --message "${{ github.sha }}" --non-interactive

  build:
    name: EAS Build (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive --no-wait
