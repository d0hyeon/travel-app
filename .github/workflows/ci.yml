name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ts-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm ts-check

  lint-check:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # PR에서 변경된 ts/tsx 파일만 lint한다. 기존 부채는 막지 않되 새 코드는 강제.
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "변경된 ts/tsx 파일이 없어 lint를 건너뜁니다."
            exit 0
          fi
          echo "$FILES"
          echo "$FILES" | xargs pnpm exec eslint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      # 러너 기본값은 UTC다. 국내 서비스라 날짜·시간 로직이 KST를 전제하므로
      # 개발 환경과 동일한 타임존으로 맞춘다. (예: 오전/오후 예보 구간 판정)
      TZ: Asia/Seoul
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e-test:
    name: End to End Tests
    runs-on: ubuntu-latest

    env:
      # 유닛 테스트와 동일하게 KST로 고정한다. 러너 기본값(UTC)에서는
      # 날짜 경계와 오전/오후 판정이 로컬 개발 환경과 달라진다.
      TZ: Asia/Seoul
      # 실제 요청은 MSW가 모두 가로챈다. 단 URL의 project ref는 supabase-js가
      # localStorage 인증 키(sb-<ref>-auth-token)를 조회하는 데 쓰이므로,
      # auth-setup이 세션을 심는 ref(feubgswdgmxrbpbfbqje)와 일치해야 인증 상태가 복원된다.
      VITE_SUPABASE_URL: https://feubgswdgmxrbpbfbqje.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
      # 유효한 형식의 더미 VAPID 공개키. 없으면 useWebPushSubscription 모듈 로드가 크래시해 dev 서버가 뜨지 않는다.
      VITE_VAPID_PUBLIC_KEY: BPDxNunbdwN4Qm0rY62q0QYPrh5PW9MeXCfBx8XSvKLD_daagykMCkmx3Zbn5jddQAA8zx3IRG8P6me0xfaaGVM
      # 카카오맵 JS 키(더미). SDK 로드는 실패해도 앱 렌더는 진행된다.
      VITE_KAKAO_MAP_KEY: placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/waylog-web/playwright-report/
            apps/waylog-web/test-results/
          retention-days: 7
