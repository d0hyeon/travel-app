name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ts-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm ts-check

  lint-check:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # PR에서 변경된 ts/tsx 파일만 lint한다. 기존 부채는 막지 않되 새 코드는 강제.
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "변경된 ts/tsx 파일이 없어 lint를 건너뜁니다."
            exit 0
          fi
          echo "$FILES"
          echo "$FILES" | xargs pnpm exec eslint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e-test:
    name: End to End Tests
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
